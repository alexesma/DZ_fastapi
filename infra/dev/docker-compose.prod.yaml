services:
  frontend:
    image: alexesma/dz_frontend:latest
    container_name: dz_frontend
    depends_on:
      - web

  web:
    image: alexesma/dz_fastapi:latest
    container_name: dz_fastapi
    # Предохранитель. Без него генерация прайса дважды доводила машину до
    # 100% памяти и держала её там часами: ядро убивало uvicorn глобальным
    # OOM, один раз дело кончилось перезагрузкой сервера. Докупленную
    # память это не вылечило — потребление выросло до нового потолка.
    #
    # Лимит не чинит причину, но меняет исход: вместо повисшей машины
    # умирает и сразу поднимается один контейнер, а база и планировщик
    # продолжают работать. Величина выбрана с запасом над обычным
    # потреблением (после старта около 0.4 ГБ) и с местом для базы,
    # планировщика и системы на машине в 11.6 ГБ.
    mem_limit: ${WEB_MEMORY_LIMIT:-5g}
    memswap_limit: ${WEB_MEMORY_SWAP_LIMIT:-6g}
    restart: unless-stopped
    volumes:
      - inbox_uploads_data:/app/uploads
      # Общий том с сервисом ftp: сюда 1С кладёт сообщения обмена
      # EnterpriseData, отсюда приложение их читает и пишет ответные.
      - onec_exchange:/app/onec_exchange
    environment:
      RUN_MODE: "api"
      ENABLE_SCHEDULER: "0"
      DATABASE_POOL_SIZE: "10"
      DATABASE_MAX_OVERFLOW: "10"
      DATABASE_POOL_TIMEOUT: "30"
      DATABASE_CONNECT_TIMEOUT: "30"

  scheduler:
    image: alexesma/dz_fastapi:latest
    container_name: dz_scheduler
    # Не позволяем ошибке тяжёлого pandas-задания вытеснить PostgreSQL и API.
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-6g}
    memswap_limit: ${SCHEDULER_MEMORY_SWAP_LIMIT:-7g}
    volumes:
      - inbox_uploads_data:/app/uploads
      - onec_exchange:/app/onec_exchange
    environment:
      RUN_MODE: "scheduler"
      ENABLE_SCHEDULER: "1"
      DATABASE_POOL_SIZE: "10"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_POOL_TIMEOUT: "30"
      DATABASE_CONNECT_TIMEOUT: "30"
      SCHEDULER_STARTUP_DELAY_SECONDS: "20"
      SCHEDULER_DB_STARTUP_ATTEMPTS: "8"
      SCHEDULER_DB_RETRY_DELAY_SECONDS: "5"
      SCHEDULER_DB_RETRY_MAX_DELAY_SECONDS: "30"
    healthcheck:
      disable: true

  db:
    ports: []
    # PostgreSQL использует /dev/shm для parallel hash/aggregate. Docker
    # по умолчанию даёт только 64 МБ, из-за чего аналитика падала с
    # DiskFullError даже при свободном основном диске.
    shm_size: ${POSTGRES_SHM_SIZE:-512mb}
    # Postgres не масштабируется под память сам: сколько бы её ни было на
    # машине, он держит стоковые 128 МБ. На базе в 8.5 ГБ это давало
    # попадание в кэш 90% и 106 ГБ временных файлов за три недели.
    #
    # Про autovacuum_vacuum_scale_factor отдельно. При стандартных 20% по
    # таблице в 33.5 млн строк вакуум ждёт 6.7 млн мёртвых строк и не
    # запускается практически никогда — autopartpricehistory разрослась
    # до 5 ГБ при 33.5 млн живых строк и ни разу не вакуумировалась.
    # Порог в 2% плюс фиксированные 5000 строк заставляют его работать
    # понемногу и постоянно, вместо одной неподъёмной уборки.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=4GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.02"
      - "-c"
      - "autovacuum_vacuum_threshold=5000"
      - "-c"
      - "autovacuum_analyze_scale_factor=0.01"
      - "-c"
      - "autovacuum_max_workers=4"
      # Зависшая сессия держит транзакцию открытой и блокирует уборку.
      # Полчаса — заведомо больше любой нашей операции.
      - "-c"
      - "idle_in_transaction_session_timeout=1800000"

  # ─── FTP-канал синхронизации с 1С:УНФ (EnterpriseData) ────────────────────
  # База 1С живёт на приватном адресе за VPN — мы к ней достучаться не можем,
  # а публикация OData у арендодателя выключена. Поэтому направление
  # перевёрнуто: 1С сама подключается сюда исходящим соединением, кладёт свои
  # сообщения обмена и забирает наши. Приложение читает те же файлы напрямую
  # с общего тома, по FTP оно не ходит и пароль от него не знает.
  #
  # Значения берутся из infra/dev/.env (рядом с этим файлом) — именно оттуда
  # compose подставляет ${...}. Корневой .env для подстановки НЕ используется,
  # он передаётся только внутрь контейнеров через env_file.
  # Инструкция: docs/integrations/1c_unf3/ftp-setup.md
  ftp:
    image: delfer/alpine-ftp-server:latest
    container_name: dz_ftp
    restart: always
    environment:
      # логин|пароль|домашний каталог|uid
      USERS: "${FTP_USER:-onec}|${FTP_PASSWORD}|/ftp/${FTP_USER:-onec}|1000"
      # публичный адрес — обязателен для пассивного режима
      ADDRESS: ${FTP_PUBLIC_HOST:-dragonzap.online}
      MIN_PORT: 30000
      MAX_PORT: 30009
    ports:
      # Нестандартный внешний порт: на 21-м круглосуточно работают переборщики
      - "${FTP_PORT:-2121}:21"
      - "30000-30009:30000-30009"
    volumes:
      - onec_exchange:/ftp/${FTP_USER:-onec}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  inbox_uploads_data:
  onec_exchange:
