#main.yml
name: Main DragonZap Workflow
# Перечень событий-триггеров, при которых должен запускаться workflow
on:
  # Событие push возникает,
  # когда изменения исходного кода приходят на сервер GitHub
  push:
    # Отслеживаем изменения только в ветке main
    branches:
      - main

env:
  API_URL: ${{ vars.API_URL }}

# Перечень задач
jobs:
  tests:
    # Разворачиваем окружение:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://testuser:testpassword@127.0.0.1:5432/testdb
      ASYNCPG_DSN: postgresql+asyncpg://testuser:testpassword@127.0.0.1:5432/testdb
      TEST_DATABASE_URL: postgresql+asyncpg://testuser:testpassword@127.0.0.1:5432/testdb

    services:
      db:
        image: postgres:13.10
        # Указываем имя тестовой базы, имя и пароль пользователя в открытом виде,
        # ведь эта база будет работать только во время прогона тестов
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        # Эта конструкция описывает проверку готовности сервиса postgres
        # Если её не будет, то тесты могут запуститься раньше, чем сервер PostgreSQL
        # В результате тесты опять решат, что базы нет, — и упадут
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    # Копируем код проекта
    - name: Check out code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: recursive
    # Устанавливаем Python с помощью action
    - name: Set up Python
      uses: actions/setup-python@v6
    # Передаём action setup-python версию Python
      with:
        python-version: 3.12

    - name: Cache Poetry dependencies
      uses: actions/cache@v5
      with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-
    # Обновляем pip, устанавливаем flake8 и flake8-isort,
    # устанавливаем зависимости проекта
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        export PATH="$HOME/.local/bin:$PATH"

    - name: Install dependencies
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        poetry install

    - name: Wait for PostgreSQL to be ready
      run: |
        until pg_isready -h 127.0.0.1 -p 5432 -U testuser; do
          echo "Waiting for PostgreSQL...";
          sleep 5;
        done

    - name: Debug Environment Variables
      run: env

    - name: Run database migrations
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        poetry run alembic upgrade heads

    # Запускаем flake8
    - name: Test with flake8
      # Вызываем flake8 и указываем ему,
      # что нужно проверить файлы только в папке backend/
      run:  |
        export PATH="$HOME/.local/bin:$PATH"
        poetry run flake8 dz_fastapi/ tests/ check_db.py seed.py

    # Запускаем pytest
    - name: Run pytest
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        export PYTHONPATH="${PYTHONPATH}:$(pwd)"
        # Каждый worker использует собственную PostgreSQL-схему,
        # поэтому полный набор безопасно выполняется параллельно.
        poetry run pytest -q -n 4 --dist loadscope --durations=50

# Frontend линтинг и сборка (без тестов пока)
  frontend_lint_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'dz_frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./dz_frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./dz_frontend
        run: npm run lint

      - name: Build frontend (проверка сборки)
        working-directory: ./dz_frontend
        run: npm run build
        env:
          VITE_API_URL: /api

# Собрать и отправить образ приложения на Docker Hub
  build_and_push_backend:
    runs-on: ubuntu-latest
    needs: tests  # Не выполнять сразу, ждать, пока выполнится tests
    steps:
      - name: Check out the repo
        # Получение исходного кода из репозитория
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Login to Docker
        # Авторизация на Docker Hub
        uses: docker/login-action@v4
        # При помощи with передаём в action параметры username и password
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        # Установка сборщика контейнеров Docker
        uses: docker/setup-buildx-action@v4
        with:
          install: true

      - name: Push to DockerHub
        # Одновременный билд и пуш образа в Docker Hub
        uses: docker/build-push-action@v7
        with:
          # Параметр context: ./backend/ указывает, что нужный Dockerfile
          # находится в .
          context: .
          # Параметр push: true указывает, что образ нужно не только собрать,
          # но и отправить на Docker Hub
          push: true
          # В параметре tags задаётся название и тег для образа.
          # Для каждого пересобранного образа
          # устанавливаем тег latest, чтобы потом
          # на сервере и в docker-compose.yml не указывать версию
          tags: alexesma/dz_fastapi:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

# Собираем и пушим frontend образ
  build_and_push_frontend:
    runs-on: ubuntu-latest
    needs: frontend_lint_and_build
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./dz_frontend  # путь к фронтенду
          push: true
          tags: alexesma/dz_frontend:latest
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    runs-on: ubuntu-latest
    needs:
      # Дождёмся билда всех образов
      - build_and_push_backend
      - build_and_push_frontend
    steps:
    - name: Checkout repo
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: recursive
    # Используем штатные OpenSSH/scp из runner. В отличие от appleboy/*@master
    # этот вариант не скачивает drone-scp/drone-ssh с GitHub Releases во время
    # деплоя и не падает из-за временного 5xx на releases.githubusercontent.com.
    - name: Configure deploy SSH key
      env:
        DEPLOY_HOST: ${{ secrets.HOST }}
        DEPLOY_SSH_KEY: ${{ secrets.SSH_KEY }}
        DEPLOY_SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      run: |
        set -euo pipefail
        install -m 700 -d "$HOME/.ssh"
        key_file="$RUNNER_TEMP/deploy_key"
        askpass_file="$RUNNER_TEMP/ssh_askpass"
        printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
        chmod 600 "$key_file"
        if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        else
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Не удалось получить SSH host key сервера"
              exit 1
            fi
            sleep $((attempt * 2))
          done
        fi
        test -s "$HOME/.ssh/known_hosts"
        chmod 600 "$HOME/.ssh/known_hosts"
        printf '%s\n' '#!/bin/sh' 'printf "%s\\n" "$DEPLOY_SSH_PASSPHRASE"' > "$askpass_file"
        chmod 700 "$askpass_file"
        eval "$(ssh-agent -s)"
        SSH_ASKPASS="$askpass_file" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
          ssh-add "$key_file" </dev/null
        printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
        rm -f "$key_file" "$askpass_file"

    # На сервере нужны только compose-файлы: код живёт в образах.
    - name: Copy compose files via scp
      env:
        DEPLOY_HOST: ${{ secrets.HOST }}
        DEPLOY_USER: ${{ secrets.USER }}
      run: |
        set -euo pipefail
        ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
          "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /root/DZ_fastapi/infra/dev'
        scp -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
          infra/dev/docker-compose.yaml infra/dev/docker-compose.prod.yaml \
          "$DEPLOY_USER@$DEPLOY_HOST:/root/DZ_fastapi/infra/dev/"

    - name: Execute remote deploy commands
      env:
        DEPLOY_HOST: ${{ secrets.HOST }}
        DEPLOY_USER: ${{ secrets.USER }}
      run: |
        set -euo pipefail
        ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
          "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          cd /root/DZ_fastapi/infra/dev/
          # Останавливаем старые контейнеры
          sudo docker compose -f docker-compose.yaml -f docker-compose.prod.yaml down
          # Скачиваем свежие образы, не удаляя локальный Docker-кэш.
          sudo docker compose -f docker-compose.yaml -f docker-compose.prod.yaml pull
          # Сначала запускаем только БД. Приложение может падать на старой схеме
          # до миграций, поэтому не делаем exec в постоянно рестартящий web.
          sudo docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --force-recreate db
          echo "Ждем запуска базы данных..."
          for i in $(seq 1 60); do
            db_health=$(sudo docker inspect -f '{{.State.Health.Status}}' dz_db_dev 2>/dev/null || true)
            if [ "$db_health" = "healthy" ]; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "База данных не запустилась вовремя"
              sudo docker compose -f docker-compose.yaml -f docker-compose.prod.yaml ps
              sudo docker logs dz_db_dev --tail 200
              exit 1
            fi
            sleep 5
          done
          # Выполняем миграции одноразовым контейнером из нового web-образа.
          sudo docker compose -f docker-compose.yaml -f docker-compose.prod.yaml run --rm --no-deps \
            -e RUN_MIGRATIONS_ON_STARTUP=0 \
            -e RUN_SEED_ON_STARTUP=0 \
            web poetry run alembic upgrade heads
          # После миграций запускаем постоянные контейнеры приложения, scheduler и фронта.
          sudo docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --force-recreate web scheduler frontend
          # FTP-канал обмена с 1С. Поднимается только если в infra/dev/.env
          # задан FTP_PASSWORD — иначе контейнер пропускаем, чтобы не поднять
          # открытый наружу FTP с пустым паролем.
          if grep -qs '^FTP_PASSWORD=..*' .env; then
            sudo docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d ftp
          else
            echo "FTP_PASSWORD не задан в infra/dev/.env — сервис ftp пропущен"
          fi
        REMOTE_SCRIPT

    - name: Stop deploy SSH agent
      if: always()
      run: |
        if [ -n "${SSH_AGENT_PID:-}" ]; then
          ssh-agent -k || true
        fi

  send_success_message:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: Send Telegram success message
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --request POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ Деплой успешно выполнен! 🎉"

  send_failure_message:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Send Telegram failure message
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --request POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Деплой завершился с ошибкой! ⚠️"
