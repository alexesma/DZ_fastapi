name: Build Windows Email Relay

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/email_relay/**"
      - ".github/workflows/email-relay-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/email_relay/requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/email_relay/requirements.txt
          python -m pip install pyinstaller==6.15.0

      - name: Build standalone executable
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --console
          --name DZEmailRelay
          scripts/email_relay/relay.py

      - name: Smoke test executable
        run: .\dist\DZEmailRelay.exe --help

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\DZEmailRelay.exe package\DZEmailRelay.exe
          Copy-Item scripts\email_relay\config.example.json package\config.json
          Copy-Item scripts\email_relay\WINDOWS-README.txt package\ИНСТРУКЦИЯ.txt
          Compress-Archive -Path package\* -DestinationPath DZEmailRelay-Windows.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DZEmailRelay-Windows
          path: DZEmailRelay-Windows.zip
          if-no-files-found: error
          retention-days: 30
